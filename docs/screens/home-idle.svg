<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="512" height="352" rx="18" fill="#1a1a1a" filter="url(#shadow)"/>
  <g transform="translate(20,20)">
    <rect width="480" height="320" rx="6" fill="#000000"/>
    <clipPath id="scr"><rect width="480" height="320" rx="6"/></clipPath>
    <g clip-path="url(#scr)">
      <rect x="0" y="0" width="480" height="38" fill="#404040"/>
      <text x="14" y="24" font-size="14" font-weight="700" fill="#00ff00">W</text>
      <text x="240" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">BEREGENING</text>
      <text x="452" y="24" font-size="14" font-weight="700" fill="#ffa500">M</text>

      <text x="240" y="90" text-anchor="middle" font-size="28" font-weight="700" fill="#c0c0c0">GEREED</text>
      <text x="240" y="118" text-anchor="middle" font-size="14" fill="#00ff00">AUTOMATISCH</text>

      <rect x="20" y="155" width="200" height="55" rx="8" fill="#1b5e20" stroke="#ffffff" stroke-width="1.5"/>
      <text x="120" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">START CYCLUS</text>

      <rect x="260" y="155" width="200" height="55" rx="8" fill="#404040" stroke="#ffffff" stroke-width="1.5"/>
      <text x="360" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ZONE KIEZEN</text>

      <rect x="20" y="230" width="200" height="50" rx="8" fill="#1b5e20" stroke="#ffffff" stroke-width="1.5"/>
      <text x="120" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AUTO: AAN</text>

      <rect x="260" y="230" width="200" height="50" rx="8" fill="#404040" stroke="#ffffff" stroke-width="1.5"/>
      <text x="360" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">INSTELLINGEN</text>
