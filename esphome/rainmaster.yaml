      - lvgl.widget.update: {id: btn_zone1, bg_color: !lambda "return (id(running) && id(active_zone) == 0) ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"}
      - lvgl.widget.update: {id: btn_zone2, bg_color: !lambda "return (id(running) && id(active_zone) == 1) ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"}
      - lvgl.widget.update: {id: btn_zone3, bg_color: !lambda "return (id(running) && id(active_zone) == 2) ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"}
      - lvgl.widget.update: {id: btn_zone4, bg_color: !lambda "return (id(running) && id(active_zone) == 3) ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"}
      - lvgl.widget.update: {id: btn_zone5, bg_color: !lambda "return (id(running) && id(active_zone) == 4) ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"}
      - lvgl.widget.update: {id: btn_zone6, bg_color: !lambda "return (id(running) && id(active_zone) == 5) ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"}
      - lvgl.widget.update: {id: btn_zone7, bg_color: !lambda "return (id(running) && id(active_zone) == 6) ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"}
      - lvgl.widget.update: {id: btn_zone8, bg_color: !lambda "return (id(running) && id(active_zone) == 7) ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"}
      - lvgl.label.update:
          id: lbl_wifi
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%s", id(wifi_comp).is_connected() ? "WiFi" : "!");
            return std::string(buf);
          text_color: !lambda "return id(wifi_comp).is_connected() ? (lv_color_t) lv_color_hex(0x00FF00) : (lv_color_t) lv_color_hex(0xFF0000);"
      - lvgl.label.update:
          id: lbl_api
