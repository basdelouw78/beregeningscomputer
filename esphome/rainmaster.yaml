  - {platform: template, name: "Zone 8 laatste beregening", id: zone8_last_run, icon: mdi:history, entity_category: diagnostic, update_interval: 30s, lambda: "if (id(last_start8) == 0) return std::string(\"nooit\"); time_t t = (time_t) id(last_start8); struct tm tmv; localtime_r(&t, &tmv); char b[20]; strftime(b, sizeof(b), \"%Y-%m-%d %H:%M\", &tmv); return std::string(b);"}

script:
  - id: start_zone
    mode: restart
    parameters:
      zone: int
      seconds: int
      cycle: bool
    then:
      - lambda: |-
          static switch_::Switch *zones[8] = {
            id(zone1_switch), id(zone2_switch), id(zone3_switch), id(zone4_switch),
            id(zone5_switch), id(zone6_switch), id(zone7_switch), id(zone8_switch)
          };
          for (int i = 0; i < 8; i++) {
            if (i != zone && zones[i]->state) zones[i]->turn_off();
          }
          if (!zones[zone]->state) zones[zone]->turn_on();
          id(active_zone) = zone;
          id(running) = true;
          id(cycle_mode) = cycle;
          id(zone_start_ms) = millis();
          id(zone_duration_s) = (uint32_t) seconds;
          id(state_text)->publish_state(cycle ? "cycle" : "manual");
          id(active_zone_text)->publish_state(to_string(zone + 1));
          uint32_t nowt = (uint32_t) ::time(nullptr);
          switch (zone) {
            case 0: id(last_start1) = nowt; break;
            case 1: id(last_start2) = nowt; break;
            case 2: id(last_start3) = nowt; break;
            case 3: id(last_start4) = nowt; break;
            case 4: id(last_start5) = nowt; break;
            case 5: id(last_start6) = nowt; break;
            case 6: id(last_start7) = nowt; break;
            case 7: id(last_start8) = nowt; break;
          }
      - script.execute: show_home
      - delay: !lambda "return (uint32_t) seconds * 1000;"
      - if:
          condition:
            lambda: "return cycle;"
          then:
            - script.execute: advance_cycle
          else:
            - script.execute: stop_all

  - id: advance_cycle
    then:
      - lambda: "id(pending_next_zone) = id(active_zone) + 1;"
      - if:
          condition:
            lambda: "return id(pending_next_zone) >= 8;"
          then:
            - script.execute: stop_all
          else:
            - script.execute:
                id: start_zone
                zone: !lambda "return id(pending_next_zone);"
                seconds: !lambda |-
                  static number::Number *nums[8] = {
                    id(zone1_runtime), id(zone2_runtime), id(zone3_runtime), id(zone4_runtime),
                    id(zone5_runtime), id(zone6_runtime), id(zone7_runtime), id(zone8_runtime)
                  };
                  return (int) nums[id(pending_next_zone)]->state;
                cycle: true

  - id: stop_all
    then:
      - script.stop: start_zone
      - lambda: |-
          static switch_::Switch *zones[8] = {
            id(zone1_switch), id(zone2_switch), id(zone3_switch), id(zone4_switch),
            id(zone5_switch), id(zone6_switch), id(zone7_switch), id(zone8_switch)
          };
          for (int i = 0; i < 8; i++) if (zones[i]->state) zones[i]->turn_off();
          id(running) = false;
          id(cycle_mode) = false;
          id(active_zone) = -1;
          id(state_text)->publish_state("idle");
          id(active_zone_text)->publish_state("-");
      - sensor.template.publish:
          id: remaining_seconds
          state: 0
      - script.execute: show_home

  - id: start_cycle
    then:
      - if:
          condition:
            switch.is_on: auto_mode
          then:
            - script.execute:
                id: start_zone
                zone: 0
                seconds: !lambda "return (int) id(zone1_runtime).state;"
                cycle: true

  - id: show_home
    then:
      - if:
          condition:
            lambda: "return id(running);"
          then:
            - lvgl.page.show: page_home_running
          else:
            - lvgl.page.show: page_home_idle

  # Wordt 8x per minuut-tick aangeroepen (één keer per zone) vanuit de
  # 15s-interval hieronder. Start de zone als vandaag in het dagmasker
  # zit en een van de 3 starttijden overeenkomt met de huidige minuut.
  - id: check_zone_schedule
    parameters:
      zone: int
      enabled: boolean
      days: string
      start1: string
      start2: string
      start3: string
      runtime_sec: int
      now_min: int
      day_bit: int
    then:
      - lambda: |-
          if (id(running) || !enabled) return;
          bool day_ok = false;
          for (char c : days) if (c == ('1' + day_bit)) day_ok = true;
          if (!day_ok) return;
          std::string slots[3] = {start1, start2, start3};
          for (int k = 0; k < 3; k++) {
            size_t c = slots[k].find(':');
            if (c == std::string::npos) continue;
            int hh = atoi(slots[k].substr(0, c).c_str());
            int mm = atoi(slots[k].substr(c + 1).c_str());
            if (hh < 0 || hh > 23 || mm < 0 || mm > 59) continue;
            if (hh * 60 + mm == now_min) {
              int sec = runtime_sec * (int) id(water_budget).state / 100;
              if (sec < 10) sec = 10;
              if (sec > 7200) sec = 7200;
              id(start_zone)->execute(zone, sec, false);
              return;
            }
          }

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(running)) {
            uint32_t elapsed = millis() - id(zone_start_ms);
            uint32_t duration_ms = id(zone_duration_s) * 1000UL;
            uint32_t remaining = (elapsed >= duration_ms) ? 0 : (duration_ms - elapsed + 999) / 1000;
            id(remaining_seconds)->publish_state(remaining);
          }
      - lvgl.label.update:
          id: lbl_timer
          text: !lambda |-
            uint32_t r = (uint32_t) id(remaining_seconds)->state;
            char buf[8];
            snprintf(buf, sizeof(buf), "%02u:%02u", r / 60, r % 60);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_active_zone
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "ZONE %d", id(active_zone) + 1);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_zone1
          text: !lambda |-
            char buf[20];
            snprintf(buf, sizeof(buf), "Zone 1  %dm", (int) id(zone1_runtime).state / 60);
            return std::string(buf);
      - lvgl.label.update:
