          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%s", id(auto_mode).state ? "AUTO: AAN" : "AUTO: UIT");
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_auto_status
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%s", id(auto_mode).state ? "AUTOMATISCH" : "HANDMATIG");
            return std::string(buf);
          text_color: !lambda "return id(auto_mode).state ? (lv_color_t) lv_color_hex(0x00FF00) : (lv_color_t) lv_color_hex(0xFFA500);"
      - lvgl.widget.update:
          id: btn_auto
          bg_color: !lambda "return id(auto_mode).state ? (lv_color_t) lv_color_hex(0x1B5E20) : (lv_color_t) lv_color_hex(0x404040);"
      - lvgl.label.update:
          id: lbl_settings_ip
          text: !lambda |-
            char buf[48];
            if (id(wifi_comp).is_connected()) {
              char ipbuf[46];
              id(wifi_comp).get_ip_addresses()[0].str_to(ipbuf);
              snprintf(buf, sizeof(buf), "%s", ipbuf);
            } else {
              snprintf(buf, sizeof(buf), "niet verbonden");
            }
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_settings_api
          text: !lambda |-
            char buf[20];
            snprintf(buf, sizeof(buf), "%s", id(api_server).is_connected() ? "verbonden" : "niet verbonden");
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_settings_raindelay
          text: !lambda |-
            int rd = (int) id(rain_delay).state;
            char buf[16];
            if (rd > 0) snprintf(buf, sizeof(buf), "%d dagen", rd);
            else snprintf(buf, sizeof(buf), "uit");
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_settings_budget
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", (int) id(water_budget).state);
            return std::string(buf);

  # Elke ~15s: hooguit eens per kalenderminuut de 8 zones langs de planning
  # leggen (regenstop, dagmasker, starttijden) en zo nodig een zone starten.
  - interval: 15s
    then:
      - lambda: |-
          time_t now = ::time(nullptr);
          if (now < 100000) return; // tijd nog niet gesynchroniseerd vanuit Home Assistant
          struct tm t; localtime_r(&now, &t);
          if (t.tm_yday != id(last_checked_yday)) {
            id(last_checked_yday) = t.tm_yday;
            if (id(rain_delay).state > 0)
              id(rain_delay).make_call().set_value(id(rain_delay).state - 1).perform();
          }
          if (t.tm_min == id(last_checked_minute)) return;
          id(last_checked_minute) = t.tm_min;
          if (id(rain_delay).state > 0 || id(running)) return;
          int now_min = t.tm_hour * 60 + t.tm_min;
          int day_bit = (t.tm_wday == 0) ? 6 : (t.tm_wday - 1);
          id(check_zone_schedule)->execute(0, id(zone1_enabled).state, id(zone1_days).state, id(zone1_start1).state, id(zone1_start2).state, id(zone1_start3).state, (int) id(zone1_runtime).state, now_min, day_bit);
          id(check_zone_schedule)->execute(1, id(zone2_enabled).state, id(zone2_days).state, id(zone2_start1).state, id(zone2_start2).state, id(zone2_start3).state, (int) id(zone2_runtime).state, now_min, day_bit);
          id(check_zone_schedule)->execute(2, id(zone3_enabled).state, id(zone3_days).state, id(zone3_start1).state, id(zone3_start2).state, id(zone3_start3).state, (int) id(zone3_runtime).state, now_min, day_bit);
          id(check_zone_schedule)->execute(3, id(zone4_enabled).state, id(zone4_days).state, id(zone4_start1).state, id(zone4_start2).state, id(zone4_start3).state, (int) id(zone4_runtime).state, now_min, day_bit);
          id(check_zone_schedule)->execute(4, id(zone5_enabled).state, id(zone5_days).state, id(zone5_start1).state, id(zone5_start2).state, id(zone5_start3).state, (int) id(zone5_runtime).state, now_min, day_bit);
          id(check_zone_schedule)->execute(5, id(zone6_enabled).state, id(zone6_days).state, id(zone6_start1).state, id(zone6_start2).state, id(zone6_start3).state, (int) id(zone6_runtime).state, now_min, day_bit);
          id(check_zone_schedule)->execute(6, id(zone7_enabled).state, id(zone7_days).state, id(zone7_start1).state, id(zone7_start2).state, id(zone7_start3).state, (int) id(zone7_runtime).state, now_min, day_bit);
          id(check_zone_schedule)->execute(7, id(zone8_enabled).state, id(zone8_days).state, id(zone8_start1).state, id(zone8_start2).state, id(zone8_start3).state, (int) id(zone8_runtime).state, now_min, day_bit);

####################################################################
# Touchscreen-UI (LVGL) — Splash / Home / Zones / Instellingen,
# analoog aan de schermen in de originele firmware (main.cpp)
