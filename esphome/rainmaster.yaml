####################################################################
# RainMaster — ESPHome-variant
#
# Zelfde hardware als de custom firmware in de repo-root:
#   MCU:     ESP32-S3-WROOM-1U-N8R2 (8 MB flash, 2 MB quad-SPI PSRAM)
#   Display: 4" ILI9488 SPI TFT, 8-pins module met XPT2046-touch en SD
#
# Verschillen t.o.v. de custom C++ firmware:
#  - Home Assistant-integratie via de native ESPHome API (automatische
#    discovery) in plaats van handmatige MQTT-discovery-topics.
#  - Geen los webconfig-formulier: WiFi-fallback + captive portal komen
#    standaard mee via ESPHome zelf; verdere instelling verloopt via de
#    ESPHome-integratie in Home Assistant (of het toestel opnieuw
#    flashen met andere WiFi-gegevens in secrets.yaml).
#  - Zone-looptijden wijzig je via de number-entiteiten in Home
#    Assistant, niet via het touchscreen — dat kon in de originele
#    firmware ook niet.
#
# BELANGRIJK: de SPI-pinnen hieronder zijn PLACEHOLDERS. Pas ze aan
# naar je eigen bedrading voor je flasht. Zie ook README.md.
####################################################################

substitutions:
  name: "rainmaster"
  friendly_name: "RainMaster"
  fw_version: "v2.0.0-esphome"

  # ---- SPI-buspinnen (gedeeld door display, touch) ----
  pin_sclk: GPIO12
  pin_mosi: GPIO11
  pin_miso: GPIO13
  # ---- Display ----
  pin_tft_cs: GPIO10
  pin_tft_dc: GPIO9
  pin_tft_rst: GPIO8
  pin_backlight: GPIO38
  # ---- Touch (XPT2046) ----
  pin_touch_cs: GPIO4
  # pin_touch_irq: GPIO7        # optioneel; zonder IRQ wordt gepolld
  # ---- SD-kaart (gereserveerd, momenteel ongebruikt) ----
  pin_sd_cs: GPIO5

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: false
  min_version: "2025.5.0"
  # Splash 2,5s tonen bij opstarten, daarna naar het startscherm
  on_boot:
    priority: -100
    then:
      - lvgl.page.show: page_splash
      - delay: 2500ms
      - script.execute: show_home

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# N8R2 = 2 MB PSRAM in quad-SPI modus (niet octal)
psram:
  mode: quad
  speed: 40MHZ

logger:

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key

# Tijd van Home Assistant (nodig voor de zone-planning hieronder)
time:
  - platform: homeassistant
    id: ha_time

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "RainMaster-Fallback"
    password: !secret ap_password

captive_portal:

####################################################################
# Backlight (GPIO38, on/off zoals in de originele firmware)
####################################################################
output:
  - platform: gpio
    id: backlight_gpio
    pin: ${pin_backlight}

light:
  - platform: binary
    id: backlight
    output: backlight_gpio
    restore_mode: ALWAYS_ON

####################################################################
# Display + touch
####################################################################
spi:
  id: tft_bus
  clk_pin: ${pin_sclk}
  mosi_pin: ${pin_mosi}
  miso_pin: ${pin_miso}

display:
  - platform: ili9xxx
    id: tft
    model: ILI9488
    spi_id: tft_bus
    cs_pin: ${pin_tft_cs}
    dc_pin: ${pin_tft_dc}
    reset_pin: ${pin_tft_rst}
    color_order: BGR      # wissel naar RGB als kleuren omgedraaid ogen
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never   # LVGL tekent en flusht zelf

touchscreen:
  platform: xpt2046
  id: touch
  display: tft
  spi_id: tft_bus
  cs_pin: ${pin_touch_cs}
  # interrupt_pin: ${pin_touch_irq}
  update_interval: 50ms
  # Startwaarden overgenomen uit de touchkalibratie van de C++ firmware
  # (config.h: TOUCH_CAL_X0/X1/Y0/Y1). Coördinatensystemen verschillen
  # per library — controleer/herijk met de x_raw/y_raw-waarden die
  # on_touch hieronder logt, en pas zo nodig calibration/transform aan.
  calibration:
    x_min: 231
    x_max: 3663
    y_min: 253
    y_max: 3471
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false
  on_touch:
    - lambda: |-
        ESP_LOGD("touch", "x=%d y=%d (raw x=%d y=%d)", touch.x, touch.y, touch.x_raw, touch.y_raw);
  on_release:
    - if:
        condition:
          lvgl.is_paused:
        then:
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: backlight

####################################################################
# Beregeningslogica — zones, auto-modus, looptijden
# (worden automatisch als entiteiten in Home Assistant ontdekt)
####################################################################
