; PlatformIO project configuration
;
; Hardware:
;   MCU:     ESP32-S3-WROOM-1U-N8R2 (8 MB flash, 2 MB quad-SPI PSRAM)
;   Display: 4" ILI9488 SPI TFT, 8-pins module met touch (XPT2046-achtig) en SD-kaartslot
;
; BELANGRIJK: de pinnen onder "TFT_eSPI setup" zijn PLACEHOLDERS.
; Pas ze aan naar je eigen bedrading voordat je flasht (zie README.md).

[env:esp32-s3-wroom-1u-n8r2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; N8R2 = 8 MB flash / 2 MB PSRAM, beide Quad-SPI (niet Octal)
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
    ayushsharma82/ElegantOTA@^3.1.6

build_flags =
    -DBOARD_HAS_PSRAM
    ; ElegantOTA moet in synchrone modus draaien: het project gebruikt de
    ; ingebouwde (synchrone) WebServer, geen ESPAsyncWebServer.
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=0

    ; ---- TFT_eSPI setup (i.p.v. een User_Setup.h in de library) ----
    ; ILI9488, 480x320, SPI. PAS DE PINNEN HIERONDER AAN NAAR JE BEDRADING!
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTOUCH_CS=4
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; SD-kaart CS-pin (module deelt de SPI-bus met het display).
    ; Wordt momenteel niet door de firmware gebruikt, maar gereserveerd
    ; zodat SPI.begin() met de juiste bus-pinnen gebeurt als je SD toevoegt.
    -DSD_CS=5
